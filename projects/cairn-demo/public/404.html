<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cairn DataTable</title>
    <script>
      // GitHub Pages single page application fallback.
      // Rewrites /cairn/sorting into /cairn/?/sorting so that index.html can boot
      // and hand the original path back to the Angular router.
      (function (l) {
        var segmentCount = 1;
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + segmentCount).join('/') +
            '/?/' +
            l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1) : '') +
            l.hash
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
