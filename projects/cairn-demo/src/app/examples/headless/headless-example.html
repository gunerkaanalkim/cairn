<app-example-shell title="Headless Example">
  <div style="margin-bottom: 1rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
    <button (click)="tableApi.toggleSort('role')">Sort by Role</button>
    <button (click)="tableApi.clearSorting()">Clear Sort</button>
    <input (input)="tableApi.setGlobalFilter($any($event.target).value)" placeholder="Filter..." />
    <button (click)="tableApi.previousPage()" [disabled]="tableApi.pagination().pageIndex === 0">Prev</button>
    <span>Page {{ tableApi.pagination().pageIndex + 1 }} / {{ tableApi.pageCount() }}</span>
    <button (click)="tableApi.nextPage()" [disabled]="tableApi.pagination().pageIndex >= tableApi.pageCount() - 1">Next</button>
    <span>{{ tableApi.selectedRows().length }} selected</span>
  </div>
  <div style="display: grid; gap: 1rem;">
    @for(row of tableApi.rows(); track row.id) {
      <div style="border: 1px solid black; padding: 1rem; display: flex; align-items: center; gap: 1rem;">
        <input type="checkbox" [checked]="row.selected" (change)="tableApi.toggleRowSelection(row.id)" />
        <div>
          <strong>{{ tableApi.cellText(row, 'name') }}</strong> - {{ tableApi.cellText(row, 'role') }}
        </div>
      </div>
    }
  </div>
</app-example-shell>
